[package]
name = "slacking-desk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Slacking Desk / 摸鱼工作台 — plugin-first desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
